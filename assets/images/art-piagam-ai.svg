<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgObsidian3" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#140812"/>
      <stop offset="70%" stop-color="#090408"/>
      <stop offset="100%" stop-color="#030104"/>
    </radialGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF5C8A"/>
    </linearGradient>
    <filter id="trophyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgObsidian3)"/>

  <!-- Plaque Monolith Glass 3D Body -->
  <g transform="translate(400, 360)" filter="url(#trophyGlow)">
    <!-- Back Glow -->
    <ellipse cx="0" cy="180" rx="160" ry="25" fill="#FF5C8A" opacity="0.35"/>

    <!-- Pedestal Base -->
    <polygon points="-160,180 160,180 130,220 -130,220" fill="#1C1420" stroke="#FFD54F" stroke-width="1.5"/>

    <!-- Crystal Obelisk Column -->
    <polygon points="-90,-180 90,-180 120,170 -120,170" fill="rgba(255, 255, 255, 0.05)" stroke="url(#goldGlow)" stroke-width="2"/>
    <polygon points="0,-210 90,-180 120,170 0,160" fill="rgba(255, 92, 138, 0.12)"/>
    <polygon points="0,-210 -90,-180 -120,170 0,160" fill="rgba(255, 213, 79, 0.08)"/>

    <!-- Inner Floating Golden Emblem -->
    <circle cx="0" cy="-10" r="55" fill="none" stroke="#FFD54F" stroke-width="2"/>
    <circle cx="0" cy="-10" r="48" fill="none" stroke="#FF5C8A" stroke-width="1" stroke-dasharray="3 5"/>
    <text x="0" y="2" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#FFD54F">∞</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="2">HONOR</text>

    <!-- Glowing Integral / Math Ribbons -->
    <path d="M -70 80 Q 0 40 70 80" stroke="#00E676" stroke-width="2" fill="none" opacity="0.8"/>
  </g>

  <!-- Title -->
  <text x="400" y="690" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="4">THE CRYSTAL TROPHY OF HONOR</text>
  <text x="400" y="725" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="13" font-weight="600" fill="#FFD54F" letter-spacing="2">ETERNAL GRATITUDE • BU DEWI ARNI, S.Pd.</text>
</svg>
