<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgObsidian2" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#150A1A"/>
      <stop offset="60%" stop-color="#0B050E"/>
      <stop offset="100%" stop-color="#040205"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5C8A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E040FB" stop-opacity="0"/>
    </radialGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgObsidian2)"/>

  <!-- Background Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="250" y1="0" x2="250" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="550" y1="0" x2="550" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="550" x2="800" y2="550"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
  </g>

  <!-- 11 Constellation Nodes & Connecting Laser Mesh -->
  <g filter="url(#laserGlow)">
    <!-- Connecting Laser Lines -->
    <path d="M 400 180 L 260 260 L 190 400 L 250 540 L 400 620 L 550 540 L 610 400 L 540 260 Z" fill="rgba(224, 64, 251, 0.06)" stroke="#FF5C8A" stroke-width="1.8"/>
    <path d="M 400 180 L 190 400 L 400 620 L 610 400 Z" stroke="rgba(0, 230, 118, 0.45)" stroke-width="1.2"/>
    <path d="M 260 260 L 550 540" stroke="rgba(255, 213, 79, 0.4)" stroke-width="1.2"/>
    <path d="M 540 260 L 250 540" stroke="rgba(255, 213, 79, 0.4)" stroke-width="1.2"/>
    
    <!-- Central Star (Bu Dewi) -->
    <line x1="400" y1="380" x2="400" y2="180" stroke="#FFD54F" stroke-width="2"/>
    <line x1="400" y1="380" x2="260" y2="260" stroke="#FF5C8A" stroke-width="1.5"/>
    <line x1="400" y1="380" x2="540" y2="260" stroke="#FF5C8A" stroke-width="1.5"/>
    <line x1="400" y1="380" x2="190" y2="400" stroke="#00E676" stroke-width="1.5"/>
    <line x1="400" y1="380" x2="610" y2="400" stroke="#00E676" stroke-width="1.5"/>
    <line x1="400" y1="380" x2="250" y2="540" stroke="#E040FB" stroke-width="1.5"/>
    <line x1="400" y1="380" x2="550" y2="540" stroke="#E040FB" stroke-width="1.5"/>
    <line x1="400" y1="380" x2="400" y2="620" stroke="#FF5C8A" stroke-width="1.5"/>

    <!-- Central Mentor Node -->
    <circle cx="400" cy="380" r="32" fill="#FFFFFF"/>
    <circle cx="400" cy="380" r="48" fill="#FF5C8A" opacity="0.4"/>
    <circle cx="400" cy="380" r="70" fill="none" stroke="#FFD54F" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- 10 Surrounding Student Nodes -->
    <circle cx="400" cy="180" r="14" fill="#00E676"/>
    <circle cx="260" cy="260" r="12" fill="#FF80AB"/>
    <circle cx="540" cy="260" r="12" fill="#FF80AB"/>
    <circle cx="190" cy="400" r="13" fill="#E040FB"/>
    <circle cx="610" cy="400" r="13" fill="#E040FB"/>
    <circle cx="250" cy="540" r="12" fill="#80D8FF"/>
    <circle cx="550" cy="540" r="12" fill="#80D8FF"/>
    <circle cx="400" cy="620" r="14" fill="#FFD54F"/>
    <circle cx="320" cy="470" r="10" fill="#FF5C8A"/>
    <circle cx="480" cy="470" r="10" fill="#FF5C8A"/>
  </g>

  <!-- Title -->
  <text x="400" y="700" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="4">THE CONSTELLATION OF 11 RPL B</text>
  <text x="400" y="735" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="13" font-weight="600" fill="#00E676" letter-spacing="2">SMKN 1 CIMAHI • UNITED UNDER BU DEWI</text>
</svg>
