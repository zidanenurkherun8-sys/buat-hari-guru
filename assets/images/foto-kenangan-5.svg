<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE7F6"/>
      <stop offset="100%" stop-color="#D1C4E9"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#g5)"/>
  <circle cx="250" cy="220" r="130" fill="#FFFFFF" opacity="0.7"/>
  <!-- Laptop & Code motif for RPL B -->
  <g transform="translate(150, 140)">
    <rect x="20" y="30" width="160" height="100" rx="8" fill="#311B92"/>
    <rect x="28" y="38" width="144" height="84" rx="4" fill="#1A237E"/>
    <!-- Code lines -->
    <line x1="40" y1="55" x2="90" y2="55" stroke="#4FC3F7" stroke-width="4" stroke-linecap="round"/>
    <line x1="98" y1="55" x2="130" y2="55" stroke="#81C784" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="72" x2="110" y2="72" stroke="#FFD54F" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="89" x2="140" y2="89" stroke="#FF8A80" stroke-width="4" stroke-linecap="round"/>
    <!-- Base -->
    <path d="M 0 130 L 200 130 L 180 145 L 20 145 Z" fill="#7E57C2"/>
    <!-- Heart above laptop -->
    <path d="M 90 10 C 90 -2 100 -2 100 5 C 100 -2 110 -2 110 10 C 110 20 100 27 100 30 C 100 27 90 20 90 10 Z" fill="#E91E63"/>
  </g>
  <text x="250" y="420" text-anchor="middle" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#311B92">"Kode, Logika &amp; Kasih Sayang"</text>
  <text x="250" y="450" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#5E35B1">RPL B Pantang Menyerah Berkat Bu Dewi</text>
</svg>